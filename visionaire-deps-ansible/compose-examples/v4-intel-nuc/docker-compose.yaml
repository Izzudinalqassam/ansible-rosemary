version: '3.7'
services:
  visionaire4:
    image: nodefluxio/visionaire4:4.57.53-blackwell
    container_name: visionaire4
    restart: unless-stopped
    ports:
      - "4004:4004"
    extra_hosts:
      - api.cloud.nodeflux.io:{ip}
    networks:
      - nf-visionaire
    shm_size: "16gb"
    logging:
      options:
        max-size: "5g"
    devices:
      - "/dev/dri/renderD128:/dev/dri/renderD128"
      - "/dev/accel/accel0:/dev/accel/accel0"
