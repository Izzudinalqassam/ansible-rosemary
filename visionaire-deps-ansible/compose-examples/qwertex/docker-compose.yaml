version: '3.8'

services:
  quertex:
    image: registry.gitlab.com/nodefluxio/quertex/go:latest-cuda12.2.0-ubuntu22.04-DeepSeek-R1-Distill-14B-AWQ-rc6
    container_name: quertex
    restart: unless-stopped
    networks:
      - nf-visionaire
    ports:
      - "4007:4000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

networks:
  nf-visionaire:
    external: true