---
# =====================================================================
# STEP 2: Install Docker CE + atur docker & containerd root dir (/data atau /root)
# Aturan: kalau /data ada → /data/docker & /data/containerd
#         kalau /data tidak ada → /root/docker & /root/containerd
# =====================================================================

- name: Update apt package index
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install dependencies untuk Docker repo
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg-agent
      - software-properties-common
    state: present

- name: Cek apakah docker sudah pernah ke-install
  ansible.builtin.command: which docker
  register: docker_installed_check
  changed_when: false
  failed_when: false

- name: Buat direktori keyrings untuk GPG key docker
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download & pasang Docker official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: false

- name: Tambahkan repository docker-ce (stable)
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
    update_cache: yes

- name: Install Docker Engine (docker-ce, docker-ce-cli, containerd.io)
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
    update_cache: yes

- name: Stop containerd & docker sebelum atur data-root (wajib, agar daemon.json baru kepake)
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
  loop:
    - docker
    - containerd
  failed_when: false  # tidak error kalau service belum jalan (fresh install)

- name: Cek apakah folder /data ada di server ini
  ansible.builtin.stat:
    path: /data
  register: data_folder_check

- name: Set docker_data_root sesuai kondisi server (/data kalau ada, /root kalau tidak)
  ansible.builtin.set_fact:
    docker_data_root: "{{ docker_root_if_data_exists if data_folder_check.stat.exists else docker_root_if_no_data }}"
    containerd_data_root: "{{ containerd_root_if_data_exists if data_folder_check.stat.exists else containerd_root_if_no_data }}"

- name: Tampilkan lokasi data-root yang dipakai
  ansible.builtin.debug:
    msg:
      - "Docker data-root     : {{ docker_data_root }}"
      - "Containerd data-root : {{ containerd_data_root }}"

- name: Buat direktori untuk docker data-root
  ansible.builtin.file:
    path: "{{ docker_data_root }}"
    state: directory
    mode: "0711"

- name: Buat direktori untuk containerd data-root
  ansible.builtin.file:
    path: "{{ containerd_data_root }}"
    state: directory
    mode: "0711"

# ── Konfigurasi containerd ─────────────────────────────────────────────────
- name: Buat direktori /etc/containerd
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Generate default containerd config (kalau belum ada)
  ansible.builtin.shell: |
    containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml

- name: Set containerd root ke lokasi yang benar
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: '^root\s*=\s*".*"'
    replace: 'root = "{{ containerd_data_root }}"'

- name: Restart containerd dengan data-root baru
  ansible.builtin.service:
    name: containerd
    state: restarted
    enabled: yes

# ── Konfigurasi docker daemon ──────────────────────────────────────────────
- name: Buat direktori /etc/docker
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0755"

- name: Template awal daemon.json (data-root saja, runtime nvidia menyusul)
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: "0644"
    backup: yes
  vars:
    with_nvidia_runtime: false

- name: Restart docker dengan data-root baru (restarted agar daemon.json benar-benar kepake)
  ansible.builtin.service:
    name: docker
    state: restarted
    enabled: yes

- name: Tambahkan user "{{ ansible_user }}" ke group docker (biar bisa jalanin docker tanpa sudo)
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes

- name: Test docker dengan hello-world
  ansible.builtin.command: docker run --rm hello-world
  register: hello_world_test
  changed_when: false
  ignore_errors: true

- name: Tampilkan hasil test hello-world
  ansible.builtin.debug:
    msg: "{{ 'Docker OK - hello-world berhasil jalan.' if hello_world_test.rc == 0 else 'PERINGATAN: docker hello-world gagal, cek manual: ' + (hello_world_test.stderr | default('')) }}"
